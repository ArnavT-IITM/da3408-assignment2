apiVersion: batch/v1
kind: Job
metadata:
  name: hp-search-job
  labels:
    app: hp-search
spec:
  completions: 12
  parallelism: 4
  completionMode: Indexed
  backoffLimit: 4
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app: hp-search
    spec:
      restartPolicy: Never
      containers:
      - name: worker
        image: hp-search-worker:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: DATA_PATH
          value: "/app/data/ml_job_dataset.csv"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        resources:
          requests:
            cpu: "900m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "512Mi"
